<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#15283a"/><stop offset="0.48" stop-color="#31526b"/><stop offset="1" stop-color="#d7a86e"/></linearGradient>
  <radialGradient id="sun"><stop offset="0" stop-color="#fff8d3" stop-opacity=".95"/><stop offset="1" stop-color="#f2c878" stop-opacity="0"/></radialGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9eef3" stop-opacity=".58"/><stop offset="1" stop-color="#6f9fb2" stop-opacity=".12"/></linearGradient>
  <filter id="soft"><feGaussianBlur stdDeviation="14"/></filter>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
