<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Human-Centered Universe — an open, living and interactive story universe.">
  <title>Human-Centered Universe</title>
  <link rel="stylesheet" href="./assets/styles.css">
  <link rel="stylesheet" href="./assets/media.v1.css">
  <link rel="stylesheet" href="./assets/reader-audio.v1.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./" aria-label="Human-Centered Universe home">
      <span class="brand-mark">HCU</span>
      <span>
        <strong>Human-Centered Universe</strong>
        <small id="live-status">Live canon</small>
      </span>
    </a>
    <div class="top-actions">
      <label class="language-control">
        <span class="sr-only">Language</span>
        <select id="language-select" aria-label="Language"></select>
      </label>
      <a id="github-link" class="github-link" target="_blank" rel="noopener">GitHub</a>
    </div>
  </header>

  <nav class="mode-nav" aria-label="Reader modes">
    <button data-mode="read" class="mode-button active">Read</button>
    <button data-mode="explore" class="mode-button">Explore</button>
    <button data-mode="create" class="mode-button">Create</button>
  </nav>

  <main id="app" class="app-shell">
    <section class="loading-card">Loading the universe…</section>
  </main>

  <footer>
    <span>Human-Centered Universe</span>
    <span>•</span>
    <span>Creation is unfinished.</span>
  </footer>

  <script src="./assets/app.js" defer></script>
  <script src="./assets/media.v1.js" defer></script>
  <script src="./assets/reader-audio.v1.js" defer></script>
</body>
</html>
