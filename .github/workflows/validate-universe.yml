name: Validate Universe

on:
  pull_request:
  push:
    branches: [ main ]
    paths-ignore:
      - "web/assets/audio/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          filter: blob:none

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Validate stories and translations
        run: python scripts/validate_universe.py

      - name: Test First Vibration observer flow
        run: node scripts/test_first_vibration_intro.mjs

      - name: Test Observer flow v2
        run: node scripts/test_observer_flow.cjs

      - name: Test FIRST VIBRATION branches
        run: node scripts/test_first_vibration_branches.mjs

      - name: Test Thirteenth Notch 3D scene
        run: node scripts/test_thirteenth_notch_3d.mjs

      - name: Test story GitHub project links
        run: node scripts/test_story_projects.cjs

      - name: Test multilingual coverage
        run: node scripts/test_translation_coverage.mjs

      - name: Test narration shard planner
        run: python scripts/test_narration_planner.py

      - name: Build Mermaid universe graph
        run: python scripts/build_graph.py

      - name: Build complete interactive reader
        run: python scripts/build_reader.py

      - name: Test objection scene and reader integration
        run: node --test experiments/hum0009-objection/test.cjs experiments/hum0009-objection/browser.test.cjs scripts/test_objection_reader.cjs

      - name: Test HUM-0011 authority scene
        run: node --test experiments/hum0011-authority/test.cjs scripts/test_authority_reader.cjs

      - name: Test reader artifact verifier failure cases
        run: python scripts/test_verify_reader_build.py

      - name: Verify complete reader artifact
        run: python scripts/verify_reader_build.py --report reader-build-report.json

      - name: Summarize reader build verification
        if: success()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads(Path("reader-build-report.json").read_text())
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
              output.write("## Reader build verified\n")
              output.write(f"- Stories: {report['story_count']}\n")
              output.write(f"- Runtime assets: {report['runtime_asset_count']}\n")
              output.write(f"- Scene source revision: {report['source_revision']}\n")
              output.write("- HUM-0009 core/integration tests: 24; HUM-0011 core/reader tests: 28; verifier fault tests: 13\n")
              output.write("- Visual, mobile, screen-reader and 3D rendering checks remain separate.\n")
          PY
