name: Validate Universe

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Validate stories and translations
        run: python scripts/validate_universe.py

      - name: Build Mermaid universe graph
        run: python scripts/build_graph.py
