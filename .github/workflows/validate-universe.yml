name: Validate Universe

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Validate stories and translations
        run: python scripts/validate_universe.py

      - name: Test First Vibration observer flow
        run: node scripts/test_first_vibration_intro.mjs

      - name: Test Observer flow v2
        run: node scripts/test_observer_flow.cjs

      - name: Test multilingual coverage
        run: node scripts/test_translation_coverage.mjs

      - name: Test narration shard planner
        run: python scripts/test_narration_planner.py

      - name: Build Mermaid universe graph
        run: python scripts/build_graph.py
