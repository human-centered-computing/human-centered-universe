name: Generate Turkish Narration

on:
  workflow_dispatch:
    inputs:
      story_id:
        description: "Story ID to generate (e.g. BRG-0002) or 'all'"
        required: true
        default: "all"
  push:
    branches:
      - main
    paths:
      - "stories/**/content/tr.md"
      - "scripts/generate_narration.py"
      - ".github/workflows/generate-narration.yml"

permissions:
  contents: write

concurrency:
  group: hcu-turkish-narration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install audio tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Piper TTS
        run: |
          python -m pip install --upgrade pip
          python -m pip install "piper-tts>=1.5,<2"

      - name: Cache Turkish voice
        uses: actions/cache@v4
        with:
          path: .cache/piper
          key: piper-tr-TR-dfki-medium-v1

      - name: Download Turkish voice
        run: |
          mkdir -p .cache/piper
          if [ ! -f ".cache/piper/tr_TR-dfki-medium.onnx" ]; then
            python -m piper.download_voices tr_TR-dfki-medium --download-dir .cache/piper
          fi

      - name: Generate narration
        env:
          HCU_TTS_MODEL: .cache/piper/tr_TR-dfki-medium.onnx
          HCU_TTS_LENGTH_SCALE: "1.08"
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python scripts/generate_narration.py --story "${{ inputs.story_id }}"
          else
            python scripts/generate_narration.py --changed-from "${{ github.event.before }}"
          fi

      - name: Commit generated audio
        run: |
          git config user.name "HCU Narration Bot"
          git config user.email "actions@users.noreply.github.com"
          git add web/assets/audio/tr
          if git diff --cached --quiet; then
            echo "No narration changes."
          else
            git commit -m "Generate Turkish narration audio [skip ci]"
            git push
          fi
