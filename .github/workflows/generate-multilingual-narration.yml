name: Generate Multilingual Narration

on:
  workflow_dispatch:
    inputs:
      language:
        description: "Language code (tr, en, de, fr, es, it) or all"
        required: true
        default: "all"
      story_id:
        description: "Story ID (e.g. BRG-0002) or all"
        required: true
        default: "all"
      resume:
        description: "Resume: skip MP3 files already committed to the repository"
        required: true
        type: boolean
        default: true
  push:
    branches:
      - main
    paths:
      - "stories/**/content/*.md"
      - "config/tts-voices.json"
      - ".github/narration-backfill-trigger"

permissions:
  contents: write
  actions: write

concurrency:
  group: hcu-multilingual-narration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      languages: ${{ steps.plan.outputs.languages }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Plan language shards
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_LANGUAGE: ${{ inputs.language || 'all' }}
          BASE_SHA: ${{ github.event.before || '' }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          LANGUAGES=$(python scripts/plan_narration_languages.py \
            --event "$EVENT_NAME" \
            --requested "$REQUESTED_LANGUAGE" \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA")
          echo "languages=$LANGUAGES" >> "$GITHUB_OUTPUT"
          echo "Narration language shards: $LANGUAGES"

  generate:
    needs: plan
    if: ${{ needs.plan.outputs.languages != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        language: ${{ fromJSON(needs.plan.outputs.languages) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install system audio tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Piper TTS
        run: |
          python -m pip install --upgrade pip
          python -m pip install "piper-tts>=1.5,<2"

      - name: Cache voice models
        uses: actions/cache@v4
        with:
          path: .cache/piper
          key: hcu-piper-${{ hashFiles('config/tts-voices.json') }}
          restore-keys: |
            hcu-piper-

      - name: Configure narration bot
        run: |
          git config user.name "HCU Narration Bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Generate narration with checkpoints
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RESUME_ARG=""
            if [ "${{ inputs.resume }}" = "true" ]; then
              RESUME_ARG="--resume"
            fi

            python scripts/generate_multilingual_narration.py \
              --language "${{ matrix.language }}" \
              --story "${{ inputs.story_id }}" \
              $RESUME_ARG \
              --checkpoint
          else
            RESUME_ARG=""
            if git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- \
              .github/narration-backfill-trigger | grep -qx ".github/narration-backfill-trigger"; then
              RESUME_ARG="--resume"
            fi

            python scripts/generate_multilingual_narration.py \
              --language "${{ matrix.language }}" \
              --changed-from "${{ github.event.before }}" \
              $RESUME_ARG \
              --checkpoint
          fi

      - name: Show final status
        if: ${{ !cancelled() }}
        run: |
          git status --short
          echo "Completed ${{ matrix.language }} narration targets are checkpointed individually."

  deploy:
    needs: [plan, generate]
    if: ${{ always() && needs.plan.outputs.languages != '[]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy latest completed checkpoints
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run deploy-pages.yml \
            --repo human-centered-computing/human-centered-universe \
            --ref main
